<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Seu plano de tratamento · Leticia Ruths Odontologia</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
/* Marca da clínica (OdontoLink: trocar por cliente) */
:root{--ivory:#F7F2EB;--paper:#FCFAF7;--sand:#EFE6DB;--linen:#E4D6C4;--wood:#9A6A3E;--wood-2:#C18E5D;--ink:#1E1B18;--ink-2:#5E554C;--ink-3:#8D8277;--line:rgba(30,27,24,.12);--good:#4F7F52;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Jost',Arial,sans-serif;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ivory);color:var(--ink);font-family:var(--sans);font-weight:300;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
.wrap{max-width:540px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top)) 22px calc(40px + env(safe-area-inset-bottom))}
.num{font-family:var(--serif);font-variant-numeric:lining-nums}
header{text-align:center;margin-bottom:34px}
header img{height:70px}
header small{display:block;margin-top:10px;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-3)}
.pv{background:#1E1B18;color:#F7F2EB;font-size:12px;text-align:center;padding:8px;border-radius:999px;margin-bottom:20px;letter-spacing:.04em}
h1{font-family:var(--serif);font-weight:300;font-size:44px;line-height:1.02;letter-spacing:-.01em}
h1 em{color:var(--wood)}
.meta{color:var(--ink-2);font-size:14.5px;margin:12px 0 26px}
.reveal{opacity:0;transform:translateY(18px);animation:in 1s var(--ease) forwards}
@keyframes in{to{opacity:1;transform:none}}
.video{position:relative;border-radius:22px;overflow:hidden;background:#1E1B18;aspect-ratio:4/5;margin-bottom:22px;box-shadow:0 40px 60px -40px rgba(30,27,24,.5)}
.video video{width:100%;height:100%;object-fit:cover;display:block}
.video .ov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:22px;background:linear-gradient(transparent 45%,rgba(20,16,14,.75));color:#fff;cursor:pointer;transition:opacity .5s}
.video .ov.hide{opacity:0;pointer-events:none}
.video .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:78px;height:78px;border-radius:50%;background:rgba(252,250,247,.94);display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.video .play::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:1px solid rgba(255,255,255,.5);animation:pulse 2.4s var(--ease) infinite}
@keyframes pulse{from{transform:scale(.85);opacity:1}to{transform:scale(1.35);opacity:0}}
.video .ov b{font-family:var(--serif);font-weight:400;font-size:24px;display:block}
.video .ov span{font-size:13px;opacity:.85}
.quote{border-left:2px solid var(--wood-2);padding:4px 0 4px 18px;margin:6px 0 34px;font-family:var(--serif);font-size:21px;line-height:1.35;color:var(--ink)}
.quote small{display:block;font-family:var(--sans);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);margin-top:10px}
.sec{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--ink-3);margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;margin-bottom:10px;transition:border-color .35s,box-shadow .35s,transform .35s var(--ease)}
.opt:active{transform:scale(.99)}
.opt.sel{border-color:var(--wood);box-shadow:0 0 0 3px #F1E4D5}
.opt .r{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.opt b{font-weight:500;font-size:16px}
.opt .tag{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;background:var(--ink);color:var(--ivory);padding:3px 9px;border-radius:99px;margin-left:8px;vertical-align:2px}
.opt .p{font-family:var(--serif);font-size:26px;font-variant-numeric:lining-nums;white-space:nowrap}
.opt small{display:block;color:var(--ink-3);font-size:13px;margin-top:4px}
.pay{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;margin:22px 0}
.tg{display:grid;grid-template-columns:1fr 1fr;background:var(--sand);border-radius:999px;padding:4px;margin-bottom:16px}
.tg button{padding:11px;border-radius:999px;font-size:14px;transition:background .35s,color .35s}
.tg button.on{background:var(--ink);color:var(--ivory)}
.big{font-family:var(--serif);font-size:36px;text-align:center;font-variant-numeric:lining-nums;line-height:1.1}
.big small{display:block;font-family:var(--sans);font-size:12.5px;color:var(--ink-3);margin-top:4px}
input[type=range]{width:100%;accent-color:var(--wood);margin:16px 0 4px}
.rg{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3)}
.cta{width:100%;padding:18px;border-radius:999px;background:var(--wood);color:#fff;font-size:15px;letter-spacing:.04em;transition:background .35s,transform .3s var(--ease)}
.cta:hover{background:var(--ink)}.cta:active{transform:scale(.98)}
.cta[disabled]{opacity:.5}
.help{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:16px;font-size:14px;color:var(--ink-2);text-decoration:none}
.help svg{width:18px;height:18px}
.valid{text-align:center;font-size:12.5px;color:var(--ink-3);margin-top:18px}
.done{text-align:center;padding-top:20px}
.done .ok{width:84px;height:84px;border-radius:50%;background:#E5EFE2;color:var(--good);display:grid;place-items:center;margin:0 auto 22px}
.done h1{margin-bottom:12px}
.done p{color:var(--ink-2);max-width:34ch;margin:0 auto 26px}
.sum{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;text-align:left;margin-bottom:22px}
.sum div{display:flex;justify-content:space-between;padding:6px 0;font-size:14.5px}
.sum div span:first-child{color:var(--ink-3)}
.btn2{display:inline-flex;align-items:center;gap:10px;padding:15px 22px;border-radius:999px;border:1px solid var(--line);text-decoration:none;font-size:14px}
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(30,27,24,.4);opacity:0;pointer-events:none;transition:opacity .4s}
.sheet.on{opacity:1;pointer-events:auto}
.sheet .in{width:min(540px,100%);background:var(--ivory);border-radius:26px 26px 0 0;padding:26px 22px calc(26px + env(safe-area-inset-bottom));transform:translateY(40px);transition:transform .6s var(--ease)}
.sheet.on .in{transform:none}
.sheet h3{font-family:var(--serif);font-weight:400;font-size:28px;margin-bottom:6px}
.sheet p{color:var(--ink-2);font-size:14.5px;margin-bottom:20px}
.sheet .row{display:flex;gap:10px}
.sheet .row button{flex:1;padding:16px;border-radius:999px;font-size:14.5px}
.sheet .no{border:1px solid var(--line)}
.err{color:#A8473A;text-align:center;font-size:13.5px;min-height:20px;margin-top:10px}
.state{text-align:center;padding:60px 10px;color:var(--ink-2)}
foot{display:block;text-align:center;font-size:11.5px;color:var(--ink-3);margin-top:40px;letter-spacing:.04em}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="state">Carregando seu plano…</div></div>
<div class="sheet" id="sheet"><div class="in"><h3>Confirmar aprovação</h3><p id="shTxt"></p><div class="row"><button class="no" id="shNo">Voltar</button><button class="cta" id="shYes" style="width:auto">Aprovar</button></div><div class="err" id="shErr"></div></div></div>
<svg width="0" height="0" style="position:absolute"><symbol id="wa" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></symbol></svg>
<script>
(function(){
const CLINIC={name:'Leticia Ruths Odontologia',doctor:'Dra. Leticia Ruths',cro:'CRO/PR 26.934',wa:'5542999716401',logo:'/img/logo.png'};
const $=s=>document.querySelector(s);const app=$('#app');
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=v=>'R$ '+Math.round(v).toLocaleString('pt-BR');
const brl2=v=>'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const q=new URLSearchParams(location.search),id=q.get('id'),t=q.get('t'),preview=q.get('preview')==='1';
const wa=msg=>`https://wa.me/${CLINIC.wa}?text=${encodeURIComponent(msg)}`;
const head=`<header class="reveal"><img src="${CLINIC.logo}" alt="${CLINIC.name}"><small>Plano de tratamento</small></header>`;
let B=null,opt=0,method='parcelado',inst=1;
async function load(){
  if(!id||!t){app.innerHTML=head+'<div class="state">Link inválido. Peça um novo link à clínica.</div>';return}
  try{const r=await fetch(`/api/budgets?id=${encodeURIComponent(id)}&t=${encodeURIComponent(t)}${preview?'&preview=1':''}`,{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error);B=d.budget}
  catch(e){app.innerHTML=head+`<div class="state">Não encontramos este orçamento.<br><br><a class="btn2" href="${wa('Olá! Não consegui abrir meu orçamento pelo link.')}" target="_blank" rel="noopener"><svg width="18" height="18"><use href="#wa"/></svg>Falar com a clínica</a></div>`;return}
  opt=B.recommended||0;inst=B.maxInstallments;render();
}
function total(){const p=B.options[opt].price;return method==='pix'?Math.round(p*(1-B.pixDiscount/100)):p}
function render(){
  if(B.status==='aprovado')return renderDone();
  const exp=B.status==='expirado';
  app.innerHTML=head+(preview?'<div class="pv">Visualização da clínica · é assim que o paciente vê</div>':'')+`
  <h1 class="reveal" style="animation-delay:.08s">Olá, <em>${esc(B.patient)}</em>.<br>Este é o seu plano de sorriso.</h1>
  <p class="meta reveal" style="animation-delay:.16s">${esc(B.treatment)}</p>
  ${B.video?`<div class="video reveal" style="animation-delay:.24s"><video id="vid" src="${esc(B.video)}" playsinline preload="metadata"></video><div class="ov" id="ov"><div class="play"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="#1E1B18"/></svg></div><b>Mensagem da ${esc(CLINIC.doctor)}</b><span>Toque para assistir</span></div></div>`:''}
  ${B.message?`<div class="quote reveal" style="animation-delay:.3s">“${esc(B.message)}”<small>${esc(CLINIC.doctor)} · ${esc(CLINIC.cro)}</small></div>`:''}
  ${exp?`<div class="state" style="padding:20px 0">Este orçamento expirou.<br>Fale com a clínica para receber valores atualizados.</div>`:`
  <div class="sec">Escolha a opção</div>
  <div id="opts">${B.options.map((o,i)=>`<button class="opt ${i===opt?'sel':''}" data-i="${i}"><div class="r"><b>${esc(o.name)}${i===B.recommended&&B.options.length>1?'<span class="tag">Recomendado</span>':''}</b><span class="p">${brl(o.price)}</span></div>${o.desc?`<small>${esc(o.desc)}</small>`:''}</button>`).join('')}</div>
  <div class="pay">
    <div class="tg"><button data-m="parcelado" class="${method==='parcelado'?'on':''}">Parcelado</button><button data-m="pix" class="${method==='pix'?'on':''}">Pix${B.pixDiscount?' · '+B.pixDiscount+'% off':''}</button></div>
    <div class="big" id="big"></div>
    ${B.maxInstallments>1?`<div id="rng" ${method==='pix'?'hidden':''}><input type="range" min="1" max="${B.maxInstallments}" value="${inst}" id="inst"><div class="rg"><span>1x</span><span>até ${B.maxInstallments}x sem juros</span></div></div>`:''}
  </div>
  <button class="cta" id="ap">Aprovar meu tratamento</button>`}
  <a class="help" href="${wa(`Olá, ${CLINIC.doctor}! Estou vendo o meu plano de tratamento (${B.treatment}) e tenho uma dúvida.`)}" target="_blank" rel="noopener"><svg><use href="#wa"/></svg>Ficou com dúvida? Fale comigo</a>
  ${exp?'':`<p class="valid">${B.updated?`Atualizado em ${new Date(B.updated).toLocaleDateString('pt-BR')} · `:''}Válido até ${new Date(B.validUntil).toLocaleDateString('pt-BR')}</p>`}
  <foot>${esc(CLINIC.name)} · ${esc(CLINIC.cro)}</foot>`;
  upd();
  const v=$('#vid'),ov=$('#ov');if(v){ov.onclick=()=>{ov.classList.add('hide');v.controls=true;v.play().catch(()=>{})};v.onended=()=>{ov.classList.remove('hide');ov.querySelector('span').textContent='Assistir de novo'}}
  const o=$('#opts');if(o)o.onclick=e=>{const b=e.target.closest('.opt');if(!b)return;opt=+b.dataset.i;document.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b));upd()};
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{method=b.dataset.m;document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on',x===b));const r=$('#rng');if(r)r.hidden=method==='pix';upd()});
  const ir=$('#inst');if(ir)ir.oninput=()=>{inst=+ir.value;upd()};
  const ap=$('#ap');if(ap)ap.onclick=()=>{$('#shTxt').innerHTML=`${esc(B.options[opt].name)} · ${summary()}`;$('#shErr').textContent='';$('#sheet').classList.add('on')};
}
function summary(){const tt=total();return method==='pix'?`${brl(tt)} no Pix`:(inst>1?`${inst}x de ${brl2(tt/inst)}`:`${brl(tt)} à vista`)}
function upd(){const b=$('#big');if(!b)return;const tt=total();b.innerHTML=method==='pix'?`${brl(tt)}<small>à vista no Pix${B.pixDiscount?` · economia de ${brl(B.options[opt].price-tt)}`:''}</small>`:inst>1?`${inst}x <span style="font-size:.8em">de</span> ${brl2(tt/inst)}<small>total ${brl(tt)} · sem juros</small>`:`${brl(tt)}<small>à vista</small>`}
$('#shNo').onclick=()=>$('#sheet').classList.remove('on');
$('#sheet').onclick=e=>{if(e.target.id==='sheet')$('#sheet').classList.remove('on')};
$('#shYes').onclick=async()=>{
  if(preview){$('#shErr').textContent='Na visualização da clínica a aprovação fica desativada.';return}
  const b=$('#shYes');b.disabled=true;
  try{const r=await fetch(`/api/budgets?id=${encodeURIComponent(id)}&t=${encodeURIComponent(t)}&action=approve`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({option:opt,method,installments:inst})});const d=await r.json();if(!r.ok)throw new Error(d.error);B=d.budget;$('#sheet').classList.remove('on');renderDone();scrollTo({top:0,behavior:'smooth'})}
  catch(e){$('#shErr').textContent=e.message||'Não foi possível aprovar agora.';b.disabled=false}
};
function renderDone(){
  const c=B.choice;const pay=c.method==='pix'?`${brl(c.total)} no Pix`:(c.installments>1?`${c.installments}x de ${brl2(c.total/c.installments)}`:`${brl(c.total)} à vista`);
  app.innerHTML=head+`<div class="done reveal"><div class="ok"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
  <h1>Tratamento <em>aprovado.</em></h1><p>Obrigada pela confiança, ${esc(B.patient)}! A equipe vai entrar em contato para agendar o início.</p>
  <div class="sum"><div><span>Tratamento</span><span>${esc(B.treatment)}</span></div><div><span>Opção</span><span>${esc(c.name)}</span></div><div><span>Pagamento</span><span class="num" style="font-size:18px">${pay}</span></div></div>
  <a class="btn2" href="${wa(`Olá! Acabei de aprovar meu tratamento (${B.treatment} · ${c.name} · ${pay}). Quando podemos começar?`)}" target="_blank" rel="noopener"><svg width="18" height="18"><use href="#wa"/></svg>Agendar o início pelo WhatsApp</a></div>
  <foot>${esc(CLINIC.name)} · ${esc(CLINIC.cro)}</foot>`;
}
load();
})();
</script>
</body>
</html>
